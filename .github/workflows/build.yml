name: Build pinned cfsolve skill
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          command -v cmake || brew install cmake
          echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Prepare pinned source
        run: |
          python3 tools/check_public.py
          python3 tools/prepare.py --dest .work/upstream
      - name: Install pinned Rust
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["rust_toolchain"])')
          rustup toolchain install "$VERSION" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .work/upstream/target
          key: cfsolve-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock.json', 'patches/**', 'overlay/**') }}
          restore-keys: cfsolve-${{ runner.os }}-${{ runner.arch }}-
      - name: Offline helper tests
        run: |
          python3 -m py_compile tools/*.py tests/*.py skill/cloudflare-bypass-cfsolve/scripts/*.py
          python3 tests/test_package.py
          node --test tests/test_recaptcha.cjs
      - name: Browser helper loopback test
        run: |
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium
          node --test tests/browser/recaptcha.cjs
      - name: Build and loopback regression tests
        run: python3 tools/build.py --source .work/upstream
      - name: Package and verify
        run: |
          python3 tools/package.py --source .work/upstream --out artifacts
          python3 -c 'import glob, subprocess; [subprocess.run(["python3", "tools/verify_package.py", p], check=True) for p in glob.glob("artifacts/cloudflare-bypass-cfsolve-*.tar.gz")]'
          python3 tools/smoke_package.py --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cfsolve-skill-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
